  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A before and after comparison showing how a representative role changes under augmentation. Before: 60 percent lower-judgment volume work, 40 percent higher-judgment work. After: 20 percent lower-judgment work handled by the intern, 80 percent higher-judgment work. Three challenge labels sit below: skill gap, identity and measurement.</desc>
