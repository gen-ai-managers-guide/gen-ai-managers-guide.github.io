  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A structured framework showing inputs on the left feeding into a net value calculation on the right. Benefit inputs include time saved per task, number of tasks, and value of recovered time. Cost inputs include tool fees, oversight, process change and error correction. Net value equals total benefits minus total costs.</desc>
