  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Two columns side by side. The left shows visible costs: tool fees, subscriptions and infrastructure. The right shows invisible costs: oversight, process change and error correction. Arrows from both columns feed into a total cost box at the bottom center.</desc>
