  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A curve showing that output quality rises steeply with brief investment before leveling off. The biggest gains come early, from a minimal brief to a good one. A vague brief sits at the bottom left. A four-part brief sits near the top of the curve.</desc>
